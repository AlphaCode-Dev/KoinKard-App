name: koinkard
description: A new Flutter project.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  stacked: ^3.5.0
  stacked_services: ^1.6.0
  flutter_screenutil: ^5.9.3
  # flutter_svg pinned to 2.1.x to remain compatible with Flutter SDK 3.24.3
  flutter_svg: ^2.1.0
  convex_bottom_bar: ^3.2.0
  carousel_slider: ^5.0.0
  confetti: ^0.8.0
  google_fonts: ^6.3.2
  youtube_player_flutter: ^9.1.3
  video_player: ^2.11.1
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  flutter_localization: ^0.3.3
  dio: ^5.9.2
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  rename: ^3.1.0
  shared_preferences: ^2.5.3
  golden_toolkit: ^0.15.0

dev_dependencies:
  build_runner: ^2.5.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.2
  stacked_generator: ^2.0.0
  intl_utils: ^2.8.11
  flutter_launcher_icons: ^0.14.4

  

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/png/
    - assets/json/
    - assets/mp4/
    
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Manrope-Light.ttf
          weight: 300
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600 
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800

flutter_intl:
  enabled: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/png/KoinKardApp.png
  min_sdk_android: 21
  remove_alpha_ios: true
